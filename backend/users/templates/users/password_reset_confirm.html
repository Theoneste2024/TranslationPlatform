<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your password</title>
    <style>
      body { background: #f2f6fa; color: #17212b; font: 16px Arial, sans-serif; margin: 0; }
      main { background: white; border-radius: 12px; box-shadow: 0 2px 12px #0002; margin: 10vh auto; max-width: 420px; padding: 28px; }
      h1 { font-size: 24px; margin-top: 0; }
      label { display: block; font-weight: 600; margin: 16px 0 6px; }
      input { border: 1px solid #9aa8b5; border-radius: 6px; box-sizing: border-box; font: inherit; padding: 10px; width: 100%; }
      button { background: #00a1de; border: 0; border-radius: 6px; color: white; cursor: pointer; font: inherit; margin-top: 20px; padding: 12px; width: 100%; }
      #message { line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      {% if is_valid %}
        <h1>Choose a new password</h1>
        <form id="reset-form">
          <label for="password">New password</label>
          <input id="password" name="password" type="password" autocomplete="new-password" required>
          <label for="confirm-password">Confirm new password</label>
          <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" required>
          <button type="submit">Reset password</button>
        </form>
        <p id="message" role="status"></p>
        <script>
          document.getElementById('reset-form').addEventListener('submit', async (event) => {
            event.preventDefault();
            const message = document.getElementById('message');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            message.textContent = 'Updating password...';

            try {
              const response = await fetch(window.location.href, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify({ password, confirm_password: confirmPassword })
              });
              const result = await response.json();
              if (!response.ok) {
                message.textContent = Object.values(result).flat().join(' ');
                return;
              }
              document.getElementById('reset-form').remove();
              message.textContent = result.detail + ' You can now return to the app and sign in.';
            } catch (_) {
              message.textContent = 'The request failed. Check your connection and try again.';
            }
          });
        </script>
      {% else %}
        <h1>Reset link is invalid or expired</h1>
        <p>Request a new password reset link from the Mpuza app.</p>
      {% endif %}
    </main>
  </body>
</html>
