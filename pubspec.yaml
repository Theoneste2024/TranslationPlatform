name: translation_platform
description: AI-Powered Translation Platform for Rwanda and Africa
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  animations: ^2.0.11
  shimmer: ^3.0.0
  
  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^2.5.1
  
  # Networking
  dio: ^5.5.0+1
  socket_io_client: ^3.0.2
  web_socket_channel: ^3.0.3
  
  # Local Storage
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  
  # Translation & AI
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  image_picker: ^1.1.2
  google_ml_kit: ^0.18.0
  camera: ^0.11.0+2
  path: ^1.9.0
  dotted_border: ^2.1.0
  
  # VIDEO TRANSLATION
  video_player: ^2.9.1
  chewie: ^1.8.1
  file_picker: ^8.0.0+1
  http: ^1.2.1
  audioplayers: ^6.0.0
  omni_video_player: ^3.4.5  # Temporarily commented out - uncomment if needed with dependency_overrides

  # Audio Processing - Consolidated to avoid conflicts
  just_audio: ^0.9.39
  audio_service: ^0.18.14
  audio_session: ^0.1.20
  record: ^5.1.2
  # Removed flutter_sound and duplicate audioplayers to prevent conflicts

  # 🗺️ FREE MAPS - COMPATIBLE VERSIONS
  flutter_map: ^6.2.0                    # Compatible with other dependencies
  latlong2: ^0.9.1                      # Lat/Lng utilities
  flutter_map_location_marker: ^8.0.2    # For Flutter Map v6
  
  # 📍 LOCATION - FREE, NO API KEY
  geolocator: ^11.0.0                    # Stable version for compatibility
  geocoding: ^3.0.0                      # Address lookup
  
  # Offline Capabilities
  connectivity_plus: ^7.0.0
  workmanager: ^0.5.2
  background_fetch: ^1.3.4
  
  # Utilities
  intl: ^0.19.0
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^9.0.0
  flutter_nominatim: ^0.0.1+2  # Removed - too old, use geocoding instead

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  hive_generator: ^2.0.1

# Dependency overrides to resolve conflicts
dependency_overrides:
  unicode: ^1.0.0  # Ensures compatibility between packages

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/models/
    - assets/translations/
    # - assets/fonts/  # Commented out - Google Fonts handles this