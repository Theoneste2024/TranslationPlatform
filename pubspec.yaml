name: translation_platform
description: AI-Powered Translation Platform for Rwanda and Africa
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.3.3

  # Networking and files
  http: ^1.2.1
  file_picker: ^8.0.0+1
  path: ^1.9.0

  # Translation and AI
  speech_to_text: ^6.6.2
  flutter_tts: ^4.0.2
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.1
  dotted_border: ^2.1.0

  # Audio and video
  audioplayers: ^6.0.0
  camera: ^0.11.0+2
  video_player: ^2.9.1
  chewie: ^1.8.1
  omni_video_player: ^3.4.5

  # Maps and location
  flutter_map: ^6.2.0
  latlong2: ^0.9.1
  flutter_map_location_marker: ^8.0.2
  geolocator: ^11.0.0
  flutter_nominatim: ^0.0.1+2

  # Offline status
  connectivity_plus: ^7.0.0

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  unicode: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/
    - assets/icons/
    - assets/audio/
    - assets/models/
    - assets/translations/
